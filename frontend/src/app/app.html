<div class="dashboard-container">

      <mat-tab label="Process">
        <div class="tab-content">
          <app-process-form></app-process-form>
          <app-process-table></app-process-table>
        </div>
      </mat-tab>

      <!-- Tab 2: Steps -->
      <mat-tab label="Steps">

          <app-process-step-form></app-process-step-form>

      <!-- Tab 3: Overview -->
      <mat-tab label="Overview">
