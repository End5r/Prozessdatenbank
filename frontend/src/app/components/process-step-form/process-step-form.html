<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-form-field>
    <mat-label>step_order</mat-label>
    <input matInput type="number" formControlName="step_order" />
  </mat-form-field>
    
    <div class="checkbox-container">
        <mat-checkbox formControlName="is_last">
            Is Last Step
        </mat-checkbox>
    </div>
  
  <button mat-flat-button type="submit" [disabled]="form.invalid">
    submit
  </button>
</form>
