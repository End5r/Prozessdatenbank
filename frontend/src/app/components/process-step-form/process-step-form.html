<div class="form-container">
  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>Fertigungsschritt erfassen</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="step-inline-form">
        
        <!-- Schritt-Reihenfolge -->
        <mat-form-field appearance="outline">
          <mat-label>Schritt-Reihenfolge (step_order)</mat-label>
          <input matInput type="number" formControlName="step_order" placeholder="z. B. 1" />
        </mat-form-field>

        <!-- Checkbox: Is Last Step -->
        <div class="checkbox-wrapper">
          <mat-checkbox formControlName="is_last" color="primary">
            Letzter Schritt im Prozess
          </mat-checkbox>
        </div>

        <!-- Anlegen Button ganz rechts -->
        <button 
          mat-flat-button 
          color="primary" 
          type="submit" 
          [disabled]="form.invalid"
          class="submit-btn"
        >
          Anlegen
        </button>

      </form>
    </mat-card-content>
  </mat-card>
</div>
